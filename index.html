<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maksim Muzhchinin</title>
<meta name="theme-color" content="#F5F6F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340..680&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F5F6F2;
    --paper-raised: #FFFFFF;
    --ink: #15181B;
    --ink-soft: #565F63;
    --accent: #1F4B43;
    --accent-soft: #E3ECE7;
    --line: rgba(21,24,27,0.13);
    --shadow: rgba(21,24,27,0.08);
  }
 
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14171A;
      --paper-raised: #1B1F22;
      --ink: #F1F2EE;
      --ink-soft: #9BA3A6;
      --accent: #7BC4B2;
      --accent-soft: rgba(123,196,178,0.14);
      --line: rgba(241,242,238,0.14);
      --shadow: rgba(0,0,0,0.35);
    }
  }
 
  :root[data-theme="dark"] {
    --paper: #14171A;
    --paper-raised: #1B1F22;
    --ink: #F1F2EE;
    --ink-soft: #9BA3A6;
    --accent: #7BC4B2;
    --accent-soft: rgba(123,196,178,0.14);
    --line: rgba(241,242,238,0.14);
    --shadow: rgba(0,0,0,0.35);
  }
 
  * { box-sizing: border-box; }
 
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
  }
 
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
 
  .card {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
  }
 
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; opacity: 1; transform: none; }
  }
 
  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
 
  .logo {
    width: 92px;
    height: auto;
    margin-bottom: 22px;
    filter: none;
  }
 
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .logo { filter: invert(1) brightness(1.35); }
  }
  :root[data-theme="dark"] .logo { filter: invert(1) brightness(1.35); }
 
  .name {
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    font-weight: 560;
    font-size: clamp(2.1rem, 9vw, 2.6rem);
    line-height: 1.06;
    letter-spacing: -0.01em;
    margin: 0 0 18px;
  }
 
  .role-block {
    margin: 0 0 20px;
  }
 
  .role {
    font-size: 1.02rem;
    font-weight: 500;
    margin: 0 0 6px;
  }
 
  .role .company {
    color: var(--accent);
  }
 
  .role-secondary {
    font-size: 0.94rem;
    font-weight: 400;
    color: var(--ink-soft);
    margin: 0;
  }
 
  .bio {
    font-size: 0.94rem;
    line-height: 1.55;
    color: var(--ink-soft);
    max-width: 300px;
    margin: 0 0 28px;
  }
 
  .divider {
    width: 40px;
    height: 1px;
    background: var(--line);
    margin: 0 0 28px;
  }
 
  .actions {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 0;
  }
 
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 15px 20px;
    border-radius: 10px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.96rem;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
 
  .btn:active { transform: scale(0.98); }
 
  .btn-primary {
    background: var(--accent);
    color: var(--paper);
  }
  .btn-primary:hover { opacity: 0.92; }
 
  .btn-secondary {
    background: transparent;
    color: var(--ink);
    border-color: var(--line);
  }
  .btn-secondary:hover { border-color: var(--accent); }
 
  .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
 
  .icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }
 
</style>
</head>
